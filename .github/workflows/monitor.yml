name: Monitor do streaming

on:
  schedule:
    - cron: '*/5 * * * *'     # a cada 5 minutos (o GitHub às vezes atrasa alguns minutos)
  workflow_dispatch:          # botão "Run workflow" para testar na hora
    inputs:
      teste:
        description: 'Mandar uma mensagem de teste no Telegram?'
        type: boolean
        default: true

permissions:
  contents: write             # para guardar o estado.json (situação da rádio entre uma conferência e outra)

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg (se precisar)
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Conferir o streaming
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STREAM_URL: ${{ vars.STREAM_URL }}
          NOME_RADIO: ${{ vars.NOME_RADIO }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.teste }}" = "true" ]; then
            python3 monitor.py teste
          else
            python3 monitor.py
          fi

      - name: Guardar a situação
        if: always()
        run: |
          git config user.name "monitor-radio"
          git config user.email "monitor-radio@users.noreply.github.com"
          # o GitHub desliga tarefas agendadas de repositórios sem movimento há 60 dias:
          # uma vez por mês o monitor faz um registro para continuar ligado
          ULT=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ULT )) -gt 2000000 ]; then date -u +%FT%TZ > ultimo_sinal_de_vida.txt; fi
          git add -A estado.json ultimo_sinal_de_vida.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "situação do streaming"
            git push -q || (git pull -q --rebase && git push -q) || true
          fi
